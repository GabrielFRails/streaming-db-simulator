services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: streaming_db
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - streaming_pgdata:/var/lib/postgresql/data
      - ./streaming_schema_v2.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_dados.sql:/docker-entrypoint-initdb.d/02_dados.sql:ro
      - ./sql:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming -d streaming_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  streaming_pgdata:
